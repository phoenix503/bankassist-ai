services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bankassist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bankassist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in apps/api/.env.local}
      POSTGRES_DB: bankassist
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankassist -d bankassist"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
